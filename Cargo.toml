[package]
name = "cullery"
version = "0.1.0"
edition = "2021"
description = "Fast, simple photo culler for RAW+JPEG shoots"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
rfd = "0.15"
jpeg-decoder = "0.3"
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false }
trash = "5"
raw-window-handle = "0.6"

# Dragging photos out of the window into other apps uses the Windows shell.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# Image decoding is painfully slow without optimizations, even while developing.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
